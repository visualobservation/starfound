<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarFound 寻域星空</title>
<meta name="description" content="StarFound — point your phone at the sky and it tells your telescope where to go. A plate-solving star-finding app for visual observers.">
<style>
  :root{
    --bg:#1C1B18; --bar:#070707; --line:#0F0F0F;
    --accent:#D97757; --text:#A8A7A1; --muted:#7A756E; --dim:#57534D;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.8;
  }
  header{
    background:var(--bar); border-bottom:1px solid var(--line);
    padding:20px; text-align:center;
  }
  header .brand{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px; letter-spacing:.08em; color:var(--accent); margin:0;
  }
  header .brand a{color:inherit; text-decoration:none}
  main{max-width:720px; margin:0 auto; padding:40px 22px 80px}
  h1{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:20px; font-weight:400; letter-spacing:.04em;
    color:var(--text); margin:0 0 6px;
  }
  a{color:var(--accent)}
  footer{
    max-width:720px; margin:0 auto; padding:24px 22px 60px;
    border-top:1px solid var(--line); color:var(--dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px; line-height:1.9; text-align:center;
  }
  footer a{color:var(--dim)}
  main.home{max-width:640px; padding:64px 22px 60px; text-align:center}
  .tagline{font-size:18px; color:var(--text); margin:0 0 10px}
  .sub{color:var(--muted); font-size:15px; margin:0 0 44px}
  .links{
    display:flex; flex-direction:column; gap:1px;
    background:var(--line); border:1px solid var(--line);
    border-radius:6px; overflow:hidden; text-align:left; margin:0 0 40px;
  }
  .links a{
    display:block; background:var(--bg); padding:18px 20px;
    color:var(--text); text-decoration:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px;
  }
  .links a:hover{background:#242220; color:var(--accent)}
  .links a::after{content:"›"; float:right; color:var(--dim)}
  .contact{color:var(--muted); font-size:14px}
</style>
</head>
<body>

<header>
  <p class="brand">StarFound &nbsp;寻域星空</p>
</header>

<main class="home">
  <p class="tagline">Point your phone at the sky.<br>It tells your telescope where to go.</p>
  <p class="sub">A plate-solving star-finding app for visual observers.</p>

  <nav class="links">
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./terms.html">Terms of Service</a>
  </nav>

  <p class="contact">Contact: <a href="mailto:2118556824@qq.com">2118556824@qq.com</a></p>
</main>

<footer>
  © 2026 Wenzhou StarFound Technology Co., Ltd.<br>
  温州暗夜寻星科技有限公司
</footer>

</body>
</html>
